<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adet Takvimi — Yasal</title>
<style>
  :root { --primary:#E85A7E; --bg:#FFF6F9; --card:#fff; --text:#3A2E3F; --muted:#9C92A6; --border:#F4E3EA; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); line-height:1.6; }
  .wrap { max-width:680px; margin:0 auto; padding:48px 20px; }
  .logo { width:88px; height:88px; border-radius:44px; background:#FFE1E9; display:flex;
          align-items:center; justify-content:center; font-size:44px; margin:0 auto 20px; }
  h1 { text-align:center; font-size:28px; margin:0 0 8px; }
  .sub { text-align:center; color:var(--muted); margin:0 0 32px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:20px;
          padding:20px 22px; margin-bottom:16px; display:flex; align-items:center; gap:16px;
          text-decoration:none; color:var(--text); transition:transform .1s; }
  .card:active { transform:scale(.99); }
  .card .emoji { font-size:28px; }
  .card .t { font-weight:700; font-size:17px; }
  .card .d { color:var(--muted); font-size:14px; margin-top:2px; }
  .card .arrow { margin-left:auto; color:var(--primary); font-size:22px; }
  footer { text-align:center; color:var(--muted); font-size:13px; margin-top:32px; }
  a { color:var(--primary); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🌸</div>
  <h1>Adet Takvimi — Regl Takibi</h1>
  <p class="sub">Yasal belgeler</p>

  <a class="card" href="gizlilik.html">
    <span class="emoji">🔒</span>
    <span><span class="t">Gizlilik Politikası</span><br><span class="d">Verilerin nasıl işlendiği ve haklarınız</span></span>
    <span class="arrow">›</span>
  </a>
  <a class="card" href="kosullar.html">
    <span class="emoji">📄</span>
    <span><span class="t">Kullanım Koşulları</span><br><span class="d">Uygulamayı kullanım şartları</span></span>
    <span class="arrow">›</span>
  </a>
  <a class="card" href="veri-silme.html">
    <span class="emoji">🗑️</span>
    <span><span class="t">Veri Silme</span><br><span class="d">Verilerinizi nasıl silersiniz</span></span>
    <span class="arrow">›</span>
  </a>

  <footer>
    Geliştirici: Dmora Tech · <a href="mailto:dmindtechai@gmail.com">dmindtechai@gmail.com</a>
  </footer>
</div>
</body>
</html>
